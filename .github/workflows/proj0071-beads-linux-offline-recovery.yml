# PROJ-0071 CP06: bounded Linux-only recovery of CP05 missing-git container dependency.
# Manual-only, synthetic, public standard runner, no production mutations.
name: PROJ-0071 Beads Linux offline recovery MANUAL ONLY
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-network-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout synthetic fixture by immutable action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download pinned release and prefetch Git-equipped container
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --max-time 240 --silent --show-error -o beads_1.3.1_linux_amd64.tar.gz 'https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_linux_amd64.tar.gz'
          printf '%s  %s\n' '3219443a9734b89b93fb16ee8d65844759fa1b3cd3cf139c606b7353cfb0715c' 'beads_1.3.1_linux_amd64.tar.gz' | sha256sum --check
          docker pull python:3.11.16-bookworm
          docker image inspect python:3.11.16-bookworm --format 'CONTAINER_IMAGE_ID={{.Id}} REPO_DIGEST={{index .RepoDigests 0}}'
          echo "QUAL_IMAGE_ID=$(docker image inspect python:3.11.16-bookworm --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Offline prerequisite check and Beads recovery in separated containers
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${QUAL_IMAGE_ID:-}" ]]; then echo BLOCKED_IMAGE_ID_MISSING; exit 41; fi
          set -- --rm --network none --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" -v "$PWD:/src:ro" -v "$RUNNER_TEMP:/work:rw" -w /src
          docker run "$@" "$QUAL_IMAGE_ID" git --version
          docker run "$@" "$QUAL_IMAGE_ID" python3 -c 'import socket; s=socket.socket(); rc=s.connect_ex(("1.1.1.1",443)); print("OFFLINE_PROBE",rc); assert rc != 0'
          docker run "$@" "$QUAL_IMAGE_ID" python3 -B /src/PROJ-0071/Evaluations/Beads-v1.3.1/beads_cold_start_qualification.py --self-test
          docker run "$@" "$QUAL_IMAGE_ID" python3 -B /src/PROJ-0071/Evaluations/Beads-v1.3.1/beads_cold_start_qualification.py --platform linux --archive /work/beads_1.3.1_linux_amd64.tar.gz --workspace /work/beads-offline-qualification --phase seed
          docker run "$@" "$QUAL_IMAGE_ID" python3 -B /src/PROJ-0071/Evaluations/Beads-v1.3.1/beads_cold_start_qualification.py --platform linux --archive /work/beads_1.3.1_linux_amd64.tar.gz --workspace /work/beads-offline-qualification --phase resume
          echo LINUX_ISOLATED_RESTARTED_CONTAINER_RECOVERY_PASS_CANDIDATE
# No network allowed after archive and image prefetch in pre-test step; no agents/hooks.
# No paid runners, secrets, uploads, caches, push/PR/scheduled triggers or registry changes.
